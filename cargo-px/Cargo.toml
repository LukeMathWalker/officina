[package]
name = "cargo-px"
version = "0.1.21"
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
edition = "2024"
homepage = "https://github.com/LukeMathWalker/officina/tree/main/cargo-px"
keywords = ["cargo", "generator", "build", "scripts", "generate"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/LukeMathWalker/officina"
description = "A cargo sub-command to overcome some of the limitations of build scripts for code generation."

[[bin]]
path = "src/bin/main.rs"
name = "cargo-px"

[dependencies]
ahash = "0.8.3"
anstream = "0.6.4"
anstyle = "1.0.4"
anyhow = "1.0.70"
clap = "4"
guppy = "0.17.2"
libc = "0.2.149"
once_cell = "1.17.1"
petgraph = { version = "0.6.3", features = ["stable_graph"] }
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.96"
supports-hyperlinks = "2.1.0"
textwrap = "0.16"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = [
    "env-filter",
    "fmt",
    "time",
] }
url = "2.4.1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Console",
]

[package.metadata.ci]
platforms = ["linux", "macos", "windows"]

[package.metadata.dist]
dist = true
