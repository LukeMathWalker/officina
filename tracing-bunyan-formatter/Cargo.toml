[package]
name = "tracing-bunyan-formatter"
version = "0.3.11"
authors = ["Luca Palmieri <rust@lpalmieri.com>"]
edition = "2024"

license = "MIT OR Apache-2.0"

documentation = "https://docs.rs/tracing-bunyan-formatter/"
homepage = "https://github.com/LukeMathWalker/officina/tree/main/tracing-bunyan-formatter"
readme = "README.md"
repository = "https://github.com/LukeMathWalker/officina"

description = "A Bunyan formatter for the tracing crate"

categories = ["development-tools::profiling", "development-tools::debugging"]
keywords = ["logging", "metrics", "tracing", "bunyan", "subscriber"]

[lib]
path = "src/lib.rs"

[features]
default = ["hostname"]
arbitrary-precision = ["serde_json/arbitrary_precision"]
valuable = ["tracing/valuable", "dep:valuable", "dep:valuable-serde"]
hostname = ["gethostname"]

[dependencies]
ahash = "0.8.2"
gethostname = { version = "0.2.1", optional = true }
log = "0.4.8"
serde = "1.0.106"
serde_json = { version = "1.0.52" }
time = { version = "0.3", default-features = false, features = ["formatting"] }
tracing = { version = "0.1.13", default-features = false, features = ["log", "std"] }
tracing-core = "0.1.10"
tracing-log = { version = "0.1" }
tracing-subscriber = { version = "0.3.16", default-features = false, features = ["registry", "fmt"] }
valuable = { version = "0.1.0", optional = true }
valuable-serde = { version = "0.1.0", optional = true }

[dev-dependencies]
claims = "0.6.0"
lazy_static = "1.4.0"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "local-offset"] }
tracing = { version = "0.1.13", default-features = false, features = ["log", "std", "attributes"] }
# The `valuable` tests derive `Valuable` on test types.
valuable = { version = "0.1.0", features = ["derive"] }

[lints.rust]
# `tracing`'s `valuable` support is gated behind `--cfg tracing_unstable`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tracing_unstable)"] }

[[example]]
name = "valuable"
required-features = ["valuable", "valuable/derive"]

[package.metadata.ci]
# `tracing` only supports `valuable` with `--cfg tracing_unstable`, so `--all-features` doesn't build.
feature-sets = [
    { name = "default", docs = true },
    { name = "no-default", args = ["--no-default-features"] },
    { name = "valuable", args = ["--features", "valuable,valuable/derive"], rustflags = "--cfg tracing_unstable" },
]
commands = [
    { name = "valuable example", run = "cargo run --locked --example valuable --features valuable,valuable/derive", rustflags = "--cfg tracing_unstable" },
]
