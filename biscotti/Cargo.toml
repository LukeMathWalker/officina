[package]
name = "biscotti"
version = "0.4.4"
authors.workspace = true
categories = ["web-programming::http-server"]
edition.workspace = true
homepage = "https://github.com/LukeMathWalker/officina/tree/main/biscotti"
keywords = ["cookies", "http", "web", "cookie"]
license.workspace = true
readme = "README.md"
repository.workspace = true
description = """
HTTP cookie management for Rust servers.
"""

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
aes-gcm-siv = "0.11.1"
anyhow = "1"
base64 = "0.22.1"
hkdf = "0.12"
hmac = "0.12.1"
jiff = "0.2.4"
percent-encoding = "2.3"
rand = "0.9"
serde = { version = "1.0.219", features = ["derive"], optional = true }
sha2 = "0.10"
subtle = "2.6.1"

[dev-dependencies]
googletest = "0.11.0"
serde_json = "1"

[package.metadata.ci]
# The README is generated from the crate docs. cargo-rdme resolves intra-doc links with a pinned nightly.
commands = [
    { name = "README is up to date", run = "cargo rdme install-rust-toolchain-for-intralinks && cargo rdme --check --no-fail-on-warnings" },
]
tools = ["cargo-rdme"]
