[package]
name = "actix-web-flash-messages"
version = "0.5.1"
authors = ["Luca Palmieri <rust@lpalmieri.com>"]
categories = ["asynchronous"]
documentation = "https://docs.rs/actix-web-flash-messages/"
edition = "2024"
homepage = "https://github.com/LukeMathWalker/officina/tree/main/actix-web-flash-messages/actix-web-flash-messages"
keywords = ["flash", "messages", "actix-web", "notifications"]
license = "MIT/Apache-2.0"
readme = "../README.md"
repository = "https://github.com/LukeMathWalker/officina"
description = "Flash messages for actix-web applications."

[package.metadata.docs.rs]
all-features = true

[features]
cookies = ["actix-web/secure-cookies", "actix-web/cookies"]
sessions = ["actix-session/default"]

[dependencies]
actix-session = { version = "0.10", optional = true }
actix-web = { version = "4", default-features = false }
anyhow = "1.0.44"
percent-encoding = "2.1.0"
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0.68"
thiserror = "1.0.30"
time = "0.3"
tokio = { version = "1.12.0", default-features = false, features = ["rt"] }

[dev-dependencies]
actix-rt = "2.2.0"
actix-session = { version = "0.10", features = ["cookie-session"] }
actix-test = "0.1.5"
# The doc examples use `#[actix_web::main]` and routing macros.
actix-web = { version = "4", default-features = false, features = ["macros"] }
