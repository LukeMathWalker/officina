[package]
name = "tracing-panic"
version = "0.1.3"
categories = ["development-tools::debugging"]
edition = "2024"
homepage = "https://github.com/LukeMathWalker/officina/tree/main/tracing-panic"
keywords = ["logging", "tracing", "panic", "telemetry", "hook"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/LukeMathWalker/officina"
description = "A panic hook that captures panic information as a tracing event"

[features]
default = ["capture-backtrace"]
capture-backtrace = []

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
