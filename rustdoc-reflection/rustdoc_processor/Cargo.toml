[package]
name = "rustdoc_processor"
version = "0.1.2"
categories = ["development-tools", "caching"]
edition = "2024"
homepage = "https://github.com/LukeMathWalker/officina/tree/main/rustdoc-reflection/rustdoc_processor"
keywords = ["rustdoc-json", "reflection", "rustdoc"]
license = "Apache-2.0"
repository = "https://github.com/LukeMathWalker/officina"
description = "Compute, cache, index, and query rustdoc JSON documentation"

[lints]
clippy = { large_enum_variant = "allow", result_large_err = "allow" }

[dependencies]
# Core dependencies
rustdoc-types = { workspace = true, features = ["rustc-hash", "rkyv_0_8"] }
rustdoc_ext = { workspace = true }
rustdoc_ir = { workspace = true }

# Package graph
camino = { workspace = true }
guppy = { workspace = true }

# SQLite cache
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }

# Serialization
bincode = { workspace = true, features = ["serde"] }
rkyv = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
serde_stacker = { workspace = true }

# Compute
indexmap = { workspace = true }
rayon = { workspace = true }
semver = { workspace = true }

# In-memory frozen collections
elsa = { workspace = true }

# Utilities
ahash = { workspace = true }
anyhow = { workspace = true }
fs-err = { workspace = true }
globwalk = { workspace = true }
itertools = { workspace = true }
num_cpus = { workspace = true }
once_cell = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true, default-features = true }
tracing_log_error = { workspace = true }
xxhash-rust = { workspace = true, features = ["xxh64"] }

[package.metadata.ci]
platforms = ["linux", "macos", "windows"]
