[package]
name = "rustdoc_ir"
version = "0.1.2"
categories = ["development-tools", "data-structures"]
edition = "2024"
homepage = "https://github.com/LukeMathWalker/officina/tree/main/rustdoc-reflection/rustdoc_ir"
keywords = ["rustdoc-json", "reflection", "rustdoc"]
license = "Apache-2.0"
repository = "https://github.com/LukeMathWalker/officina"
description = "An Intermediate Representation for Rust types and functions"

[dependencies]
ahash = { workspace = true }
anyhow = { workspace = true }
bimap = { workspace = true }
guppy = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
rustdoc-types = { workspace = true, features = ["rustc-hash", "rkyv_0_8"] }
rustdoc_ext = { workspace = true }
serde = { workspace = true, features = ["derive"] }
syn = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[package.metadata.ci]
platforms = ["linux", "macos", "windows"]
