[package]
name = "rustdoc_ext"
version = "0.1.1"
categories = ["development-tools"]
edition = "2024"
homepage = "https://github.com/LukeMathWalker/officina/tree/main/rustdoc-reflection/rustdoc_ext"
keywords = ["rustdoc-json", "reflection", "rustdoc"]
license = "Apache-2.0"
repository = "https://github.com/LukeMathWalker/officina"
description = "Extension traits for rustdoc-types"

[dependencies]
guppy = { workspace = true }
rustdoc-types = { workspace = true, features = ["rustc-hash", "rkyv_0_8"] }

[package.metadata.ci]
platforms = ["linux", "macos", "windows"]
