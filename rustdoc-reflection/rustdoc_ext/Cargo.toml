[package]
name = "rustdoc_ext"
description = "Extension traits for rustdoc-types"
edition = "2024"
repository = "https://github.com/LukeMathWalker/rustdoc-reflection"
homepage = "https://github.com/LukeMathWalker/rustdoc-reflection"
license = "Apache-2.0"
version = "0.1.1"
keywords = ["rustdoc-json", "reflection", "rustdoc"]
categories = ["development-tools"]

[dependencies]
guppy = { workspace = true }
rustdoc-types = { workspace = true, features = ["rustc-hash", "rkyv_0_8"] }
