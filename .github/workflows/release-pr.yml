# Opens or updates the release PR on every push to main: version bumps (with
# cargo-semver-checks) and changelogs, configured in `release-plz.toml`.
# Merging it releases the bumped crates (see `release.yml`), which refreshes the release PR when done.
# It also points cheadergen's install docs to the new version, which release-plz doesn't do.
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    # Holds the GitHub App's credentials, restricted to `main`.
    environment: release-pr
    # The PR is opened with a GitHub App's token, not `GITHUB_TOKEN`: PRs opened
    # with `GITHUB_TOKEN` don't trigger CI.
    permissions: {}
    steps:
      - name: Check for the GitHub App
        id: app
        env:
          CLIENT_ID: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$CLIENT_ID" || -z "$PRIVATE_KEY" ]]; then
            echo "::warning::Skipped: set the RELEASE_PLZ_APP_CLIENT_ID variable and the RELEASE_PLZ_APP_PRIVATE_KEY secret in the release-pr environment."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      # A short-lived token, limited to pushing the release branch and opening the PR.
      - if: steps.app.outputs.available == 'true'
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.app.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
          # release-plz pushes the release branch.
          persist-credentials: true
      - if: steps.app.outputs.available == 'true'
        run: rustup toolchain install
      # While a release is in progress (bumped versions, not tagged yet), release-plz would
      # misread the state of the crates: `release.yml` refreshes the release PR once it's done.
      - name: Check for a pending release
        id: pending
        if: steps.app.outputs.available == 'true'
        run: |
          cargo ci release plan --github-output "$GITHUB_OUTPUT"
          if grep -q '^has-release=true$' "$GITHUB_OUTPUT"; then
            echo "::notice::Skipped: a release is pending. The release workflow refreshes the release PR when it's done."
          fi
      # Formats changelogs (see `release-plz.toml`).
      - if: steps.app.outputs.available == 'true' && steps.pending.outputs.has-release == 'false'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: dprint
      - if: steps.app.outputs.available == 'true' && steps.pending.outputs.has-release == 'false'
        id: release-plz
        uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release-pr
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
      # release-plz only bumps versions and changelogs: also point cheadergen's install docs to
      # the new version, which `cheadergen/scripts/check_docs_version.sh` checks on the release PR.
      # Every release-plz update rewrites the release branch, so this runs after each one.
      - name: Point cheadergen's docs to the release
        if: steps.release-plz.outputs.pr != ''
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          branch=$(jq -r '.head_branch // empty' <<< "$PR")
          if [[ -z "$branch" ]]; then
            echo "No release PR."
            exit 0
          fi
          git fetch --quiet origin "$branch"
          git switch --quiet --detach "origin/$branch"
          bash cheadergen/scripts/bump_docs_version.sh
          if git diff --quiet; then
            echo "cheadergen's docs already point to the release."
            exit 0
          fi
          # Commit as the App's bot user, like release-plz.
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/$bot" --jq .id)
          export GIT_AUTHOR_NAME="$bot" GIT_AUTHOR_EMAIL="$bot_id+$bot@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git commit --quiet --all --message "docs(cheadergen): point the install docs to the release"
          git push --quiet origin "HEAD:refs/heads/$branch"
