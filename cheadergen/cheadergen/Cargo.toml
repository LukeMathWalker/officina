[package]
name = "cheadergen"
version = "0.3.2"
edition = "2024"
description = "Annotations for controlling C/C++ header generation from Rust."
license = "Apache-2.0"
homepage = "https://cheadergen.com"
repository = "https://github.com/LukeMathWalker/officina"
documentation = "https://docs.rs/cheadergen"
readme = "../README.md"
keywords = ["bindings", "ffi", "header", "code-generation"]
categories = ["external-ffi-bindings", "development-tools::ffi"]

[dependencies]
cheadergen_macros = { workspace = true }

[dev-dependencies]
trybuild = "1"
