[package]
name = "cheadergen_cli"
version = "0.3.2"
categories = ["external-ffi-bindings", "development-tools::ffi"]
documentation = "https://cheadergen.com"
edition = "2024"
homepage = "https://cheadergen.com"
include = ["rust-docs-toolchain", "src"]
keywords = ["bindings", "ffi", "code-generation"]
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/LukeMathWalker/officina"
description = "A tool for generating C bindings to Rust code."

[[bin]]
name = "cheadergen"
path = "src/main.rs"

[dependencies]
annotate-snippets = "0.11"
anyhow = "1"
bincode = "2"
camino = "1"
clap = { version = "4", features = ["derive", "env"] }
fs-err = "3"
guppy = { workspace = true }
heck = "0.5"
pathdiff = "0.2"
petgraph = "0.8"
rustdoc-types = { workspace = true }
rustdoc_ir = { workspace = true }
rustdoc_processor = { workspace = true }
rustdoc_resolver = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "1"
xdg-home = "1"

[dev-dependencies]
insta = "1"
tempfile = "3"

[package.metadata.ci]
# Tested by the cheadergen workflow: the tests need a nightly toolchain, C compilers and Cython.
tests = false

[package.metadata.dist]
dist = true
