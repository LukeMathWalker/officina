[workspace]
members = ["cargo:."]

# Binaries and installers for the crates that opt in with `[package.metadata.dist] dist = true`.
# The release pipeline (`.github/workflows/release.yml`) drives dist: no generated CI.
[dist]
cargo-dist-version = "0.32.0"
dist = false
hosting = "github"
# Only for the build matrix in `dist plan`'s output: the release pipeline is ours, not dist's.
ci = "github"
allow-dirty = ["ci"]
installers = ["shell", "powershell"]
install-path = "CARGO_HOME"
install-updater = false
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

# Build Linux binaries in old-glibc (manylinux) and musl containers, for compatibility.
[dist.github-custom-runners]
global = "ubuntu-latest"
x86_64-pc-windows-msvc = "windows-latest"
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-14"

[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-latest"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" }

[dist.github-custom-runners.x86_64-unknown-linux-musl]
runner = "ubuntu-latest"
container = { image = "quay.io/pypa/musllinux_1_2_x86_64", host = "x86_64-unknown-linux-musl" }
