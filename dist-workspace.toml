[workspace]
members = ["cargo:."]

# Binaries and installers for the crates that opt in with `[package.metadata.dist] dist = true`.
# The release pipeline (`.github/workflows/release.yml`) drives dist: no generated CI.
[dist]
cargo-dist-version = "0.32.0"
dist = false
hosting = "github"
# Only for the build matrix in `dist plan`'s output: the release pipeline is ours, not dist's.
ci = "github"
allow-dirty = ["ci"]
installers = ["shell", "powershell"]
install-path = "CARGO_HOME"
install-updater = false
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

# Build Linux binaries in old-glibc (manylinux) and musl containers, for compatibility.
# Images are pinned by digest: released binaries are built in them.
[dist.github-custom-runners]
global = "ubuntu-latest"
x86_64-pc-windows-msvc = "windows-latest"
# Both macOS targets build on Apple silicon (x86_64 is cross-compiled), like uv.
aarch64-apple-darwin = "macos-26"
x86_64-apple-darwin = "macos-26"

[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-latest"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae", host = "x86_64-unknown-linux-musl" }

[dist.github-custom-runners.x86_64-unknown-linux-musl]
runner = "ubuntu-latest"
container = { image = "quay.io/pypa/musllinux_1_2_x86_64@sha256:dc96c1f69b8a6241bcc8175a8d89b1caf0dccf959ff111a2272c42747af38350", host = "x86_64-unknown-linux-musl" }
