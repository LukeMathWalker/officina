[package]
name = "tracing_log_error"
version = "0.1.5"
edition.workspace = true
homepage = "https://github.com/LukeMathWalker/officina/tree/main/tracing_log_error"
keywords = ["tracing", "telemetry", "logging", "error-handling"]
license.workspace = true
repository.workspace = true
description = "A set of helpers to capture rich error context in tracing logs"

[lints]
workspace = true

[dependencies]
tracing = { version = "0.1.41", default-features = false, features = ["std"] }

[dev-dependencies]
anyhow = "1"

[package.metadata.ci]
# The README is generated from the crate docs. cargo-rdme resolves intra-doc links with a pinned nightly.
commands = [
    { name = "README is up to date", run = "cargo rdme install-rust-toolchain-for-intralinks && cargo rdme --check" },
]
tools = ["cargo-rdme"]
