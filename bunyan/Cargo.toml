[package]
name = "bunyan"
version = "0.1.10"
authors.workspace = true
edition.workspace = true
homepage = "https://github.com/LukeMathWalker/officina/tree/main/bunyan"
license.workspace = true
repository.workspace = true
description = "A CLI to pretty print structured logs. A Rust port of the original JavaScript bunyan CLI."

[[bin]]
path = "src/main.rs"
name = "bunyan"

[lib]
path = "src/lib.rs"
name = "bunyan"

[dependencies]
anyhow = "1.0.66"
atty = "0.2.14"
chrono = { version = "0.4.23", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.0.27", features = ["derive"] }
colored = "2.0.0"
itertools = "0.10.5"
serde = { version = "1.0.147", features = ["derive"] }
serde_json = "1.0.89"

[dev-dependencies]
assert_cmd = "2.0.6"
predicates = "2.1.3"

[package.metadata.dist]
dist = true
